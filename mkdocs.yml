site_name: Hamlib for Mere Mortals
site_description: One library that talks to hundreds of radios so your programs do not have to. Driving a rig with rigctl, sharing it through rigctld, turning an antenna with rotctl, and practising all of it on a dummy radio that can never transmit, with the safety rules and the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/hamlib-for-mere-mortals/
copyright: 'Part of <a href="https://paulsullivan33-dev.github.io/mere-mortals/">For Mere Mortals</a> · Text <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>, code MIT'

